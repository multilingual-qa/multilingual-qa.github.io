name: Update leaderboard from EvalAI

on:
  schedule:
    - cron: "17 * * * *"      # every hour (minute 17 avoids the top-of-hour rush)
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch leaderboards from EvalAI
        run: python scripts/fetch_leaderboard.py --challenge 2738 --out docs/data/leaderboard.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/leaderboard.json; then
            echo "No leaderboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/leaderboard.json
          git commit -m "Update leaderboard from EvalAI"
          git push